<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: senza, env(safe-area-inset-*) resta a zero e la nav
     bar finisce sotto la barra home dell'iPhone.
     user-scalable=no: e' un'app, non un documento. Lo zoom qui non serve a
     leggere, serve solo a sballare il layout con un doppio tocco storto sulla
     griglia. Safari lo ignora in una scheda normale ma lo rispetta in
     modalita' standalone, cioe' proprio dove l'app vive. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<meta name="theme-color" content="#08090C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PrjSpesa">
<title>PrjSpesa</title>
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS non prende l'icona dal manifest: la vuole qui. -->
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app">
    <div></div>
    <div class="empty-state">Avvio…</div>
    <div></div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
